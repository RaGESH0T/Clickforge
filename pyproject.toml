[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "clickforge"
version = "0.1.0"
description = "ClickForge - a polished, safety-first desktop autoclicker."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "ClickForge contributors" }]
keywords = ["autoclicker", "desktop", "pyqt", "pyside6", "productivity"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: X11 Applications :: Qt",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows :: Windows 10",
    "Operating System :: Microsoft :: Windows :: Windows 11",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Utilities",
]
dependencies = [
    "PySide6>=6.8,<6.13",
    "platformdirs>=4.2,<5",
    "python-xlib>=0.33,<0.34; sys_platform == 'linux'",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<10",
    "pytest-qt>=4.4,<5",
    "ruff>=0.9,<1",
    "pyinstaller>=6.11,<7",
]

[project.scripts]
clickforge = "clickforge.app:main"

[project.gui-scripts]
clickforge-gui = "clickforge.app:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
clickforge = ["resources/*.svg", "resources/icons/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
qt_api = "pyside6"

[tool.ruff]
target-version = "py310"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
